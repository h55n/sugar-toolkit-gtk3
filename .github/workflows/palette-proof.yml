name: Palette native build and full tests
on:
  workflow_dispatch:
  push:
    branches: [ci/palette-resize-proof]
jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        revision: [patched, baseline]
    steps:
      - uses: actions/checkout@v4
      - name: Select unchanged baseline
        if: matrix.revision == 'baseline'
        run: git fetch origin f14c100ade64c589b8f4e919086d8d98d2e185e4 && git checkout f14c100ade64c589b8f4e919086d8d98d2e185e4
      - name: Install native and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool python3-all-dev libgtk-3-dev libgdk-pixbuf2.0-dev libsm-dev libice-dev librsvg2-dev libxfixes-dev libxi-dev libx11-dev gettext intltool libxml-parser-perl x11proto-core-dev libasound2-dev libgirepository1.0-dev linux-libc-dev gir1.2-sugarext-1.0 gir1.2-webkit2-4.1 python3-decorator python3-dateutil python3-gi-cairo gir1.2-telepathyglib-0.12 xvfb dbus-x11 python3-pycodestyle python3-pyflakes
      - name: Install required Autoconf 2.72
        run: |
          curl -fSL --retry 3 https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz -o /tmp/autoconf.tar.xz
          tar xf /tmp/autoconf.tar.xz -C /tmp
          cd /tmp/autoconf-2.72
          ./configure --prefix="$HOME/autoconf-2.72"
          make -j2
          make install
          echo "$HOME/autoconf-2.72/bin" >> "$GITHUB_PATH"
      - name: Build and install native toolkit
        run: |
          ./autogen.sh --prefix=/usr --with-python3
          make -j2
          sudo make install
      - name: Run regression tests
        if: matrix.revision == 'patched'
        run: dbus-run-session -- xvfb-run -a env PYTHONPATH="$PWD/src" /usr/bin/python3 -m unittest discover -s tests -p test_palettewindow.py -v
      - name: Run full test suite
        run: dbus-run-session -- xvfb-run -a env PYTHONPATH="$PWD/src" /usr/bin/python3 -m sugar3.test.discover "$PWD/tests"
