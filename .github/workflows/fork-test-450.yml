name: Fork test 450
on:
  push:
    branches: [ci-test-450]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential autoconf automake libtool python3-all-dev libgtk-3-dev
          sudo apt install -y libgdk-pixbuf2.0-dev libsm-dev libice-dev librsvg2-dev libxfixes-dev libxi-dev libx11-dev gettext intltool
          sudo apt install -y libxml-parser-perl x11proto-core-dev libasound2-dev libgirepository1.0-dev linux-libc-dev
          sudo apt install -y python3-gi python3-gi-cairo python3-dbus python3-decorator python3-dateutil python3-pyflakes python3-pycodestyle
          sudo apt install -y gir1.2-gtk-3.0 gir1.2-telepathyglib-0.12 gir1.2-webkit2-4.1 gir1.2-sugarext-1.0 xvfb git
      - name: Build as upstream CI does
        run: |
          sed -i 's/72/69/g' configure.ac
          ./autogen.sh --with-python3
          make
      - name: Test with the fix (make test steps)
        id: fix
        continue-on-error: true
        run: |
          export PYTHONPATH=$PWD/src
          python3 -m pyflakes src/sugar3/presence/connectionmanager.py tests/test_connectionmanager.py; echo "pyflakes(changed files) rc=$?"
          python3 -m pyflakes src tests || echo "pyflakes whole tree rc=$? (pre-existing)"
          python3 -m pycodestyle src/sugar3/presence/connectionmanager.py tests/test_connectionmanager.py; echo "pycodestyle(changed files) rc=$?"
          export NO_AT_BRIDGE=1
          xvfb-run -a python3 -m sugar3.test.discover $PWD/tests 2>&1 | tee /tmp/fix.log | tail -60
          echo "RESULT_FIX=$(grep -E '^(OK|FAILED)' /tmp/fix.log)"
          grep -E "test_connectionmanager|skipped" /tmp/fix.log || true
      - name: Test without the fix (baseline)
        continue-on-error: true
        run: |
          git show 8af47b9:src/sugar3/presence/connectionmanager.py > src/sugar3/presence/connectionmanager.py
          export PYTHONPATH=$PWD/src
          export NO_AT_BRIDGE=1
          xvfb-run -a python3 -m sugar3.test.discover $PWD/tests 2>&1 | tee /tmp/base.log | tail -60
          echo "RESULT_BASE=$(grep -E '^(OK|FAILED)' /tmp/base.log)"
