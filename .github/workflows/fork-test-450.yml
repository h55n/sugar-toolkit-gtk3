name: Fork test 450
on:
  push:
    branches: [ci-test-450]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-all-dev libgtk-3-dev python3-gi python3-gi-cairo python3-dbus python3-decorator python3-dateutil python3-pytest
          sudo apt install -y gir1.2-gtk-3.0 gir1.2-telepathyglib-0.12 gir1.2-webkit2-4.1 gir1.2-sugarext-1.0 xvfb gettext git
      - name: Full upstream test discover with the fix
        continue-on-error: true
        run: |
          PYTHONPATH=src xvfb-run -a python3 -m sugar3.test.discover tests 2>&1 | tee /tmp/with_fix.log | tail -25
      - name: New test with the fix
        run: |
          PYTHONPATH=src xvfb-run -a python3 -m unittest -v tests.test_connectionmanager 2>&1 | tee /tmp/new_fix.log
          grep -q "skipped" /tmp/new_fix.log && { echo "TEST WAS SKIPPED"; exit 1; } || true
      - name: New test without the fix (must fail with KeyError)
        run: |
          git show 8af47b9:src/sugar3/presence/connectionmanager.py > src/sugar3/presence/connectionmanager.py
          if PYTHONPATH=src xvfb-run -a python3 -m unittest -v tests.test_connectionmanager > /tmp/new_nofix.log 2>&1; then echo "expected failure without fix"; cat /tmp/new_nofix.log; exit 1; fi
          grep -n "KeyError" /tmp/new_nofix.log | head
          tail -8 /tmp/new_nofix.log
      - name: Baseline full discover without the fix
        continue-on-error: true
        run: |
          PYTHONPATH=src xvfb-run -a python3 -m sugar3.test.discover tests 2>&1 | tail -8
