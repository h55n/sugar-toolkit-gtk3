name: Fork test 450
on:
  push:
    branches: [ci-test-450]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential autoconf automake libtool python3-all-dev libgtk-3-dev
          sudo apt install -y libgdk-pixbuf2.0-dev libsm-dev libice-dev librsvg2-dev libxfixes-dev libxi-dev libx11-dev gettext intltool
          sudo apt install -y libxml-parser-perl x11proto-core-dev libasound2-dev libgirepository1.0-dev linux-libc-dev
          sudo apt install -y python3-gi python3-gi-cairo python3-dbus python3-decorator python3-dateutil python3-pyflakes python3-pycodestyle
          sudo apt install -y gir1.2-gtk-3.0 gir1.2-telepathyglib-0.12 gir1.2-webkit2-4.1 gir1.2-sugarext-1.0 xvfb git
      - name: Build as upstream CI does
        run: |
          sed -i 's/72/69/g' configure.ac
          ./autogen.sh --with-python3
          make
      - name: Bundle failures detail (with fix)
        run: |
          export PYTHONPATH=$PWD/src NO_AT_BRIDGE=1
          xvfb-run -a python3 -m unittest tests.test_bundle tests.test_bundlebuilder 2>&1 | grep -vE "^hint:" | grep -E "Error|assert|Assertion|FAIL|ERROR|File \"/home" | sort | uniq -c | sort -rn | head -40
      - name: Full discover with AT-SPI bus (with fix)
        run: |
          sudo apt install -y at-spi2-core dbus-x11 gir1.2-atspi-2.0
          export PYTHONPATH=$PWD/src
          cat > /tmp/run.sh <<'EOS'
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 2
          python3 -m sugar3.test.discover tests 2>&1 | grep -E "^(Ran |OK|FAILED|ERROR:|FAIL:)|test_connectionmanager|Trace/"
          echo "DISCOVER_FIX_RC=$?"
          EOS
          xvfb-run -a dbus-run-session -- bash /tmp/run.sh || true
      - name: Full discover with AT-SPI bus (base source)
        run: |
          git show 8af47b9:src/sugar3/presence/connectionmanager.py > src/sugar3/presence/connectionmanager.py
          export PYTHONPATH=$PWD/src
          xvfb-run -a dbus-run-session -- bash /tmp/run.sh || true
